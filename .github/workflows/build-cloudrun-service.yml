name: build-cloudrun-service

on:
  push:
    paths:
      - "samples/cloudrun-service/**"
      - ".github/workflows/_build-sample.yml"
      - ".github/workflows/build-cloudrun-service.yml"
      - ".tflint.hcl"
  pull_request:
    paths:
      - "samples/cloudrun-service/**"
      - ".github/workflows/_build-sample.yml"
      - ".github/workflows/build-cloudrun-service.yml"
      - ".tflint.hcl"

concurrency:
  group: build-cloudrun-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-sample.yml
    with:
      sample: cloudrun-service
