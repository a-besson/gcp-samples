name: build-cloudrun-bastion

on:
  pull_request:
    paths:
      - "samples/cloudrun-bastion/**"
      - ".github/workflows/_build-sample.yml"
      - ".github/workflows/build-cloudrun-bastion.yml"
      - ".tflint.hcl"

concurrency:
  group: build-cloudrun-bastion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-sample.yml
    with:
      sample: cloudrun-bastion
