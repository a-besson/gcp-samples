# Repository-wide quality gate: pre-commit (hygiene, fmt, validate, tflint, generated docs, gitleaks).
name: check-quality

on:
  pull_request:

concurrency:
  group: check-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Kept in sync with the version contributors get from `brew install
  # terraform-docs` (root README Prerequisites): a different version renders
  # the TFDOCS.md tables differently and the terraform_docs hook would drift.
  TERRAFORM_DOCS_VERSION: "0.24.0"
  # sha256sum of terraform-docs-v0.24.0-linux-amd64.tar.gz, pinned from the
  # project's published checksums (release assets), verified before use.
  TERRAFORM_DOCS_SHA256: "9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3"

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # terraform_docs hook shells out to a system `terraform-docs` binary; no
      # official setup-action exists, so install the pinned release and verify
      # its checksum before use.
      - name: Install tooling
        run: |
          python -m pip install pre-commit==4.6.2
          asset="terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/${asset}"
          echo "${TERRAFORM_DOCS_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" terraform-docs
          sudo install -m 0755 terraform-docs /usr/local/bin/terraform-docs
          rm -f "${asset}" terraform-docs
          terraform-docs --version
      - name: Install tflint plugins
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
