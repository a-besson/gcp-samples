name: Samples CI

on:
  push:
    branches: [main]
    paths:
      - "samples/**"
      - ".github/workflows/samples-ci.yml"
  pull_request:
    paths:
      - "samples/**"
      - ".github/workflows/samples-ci.yml"

permissions:
  contents: read

jobs:
  discover:
    name: Discover samples
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build sample matrix
        id: list
        run: |
          entries="[]"
          for sample_dir in samples/*/; do
            name="$(basename "$sample_dir")"
            infra_dir="${sample_dir%/}/infra"
            [ -d "$infra_dir" ] || continue

            # A sample "contains a container" when it ships a Containerfile/Dockerfile
            # (app image to scan) alongside its Terraform.
            container_file="$(find "$sample_dir" -maxdepth 3 \( -iname 'Containerfile' -o -iname 'Dockerfile' \) -not -path '*/.terraform/*' | sort | head -n1)"
            if [ -n "$container_file" ]; then
              has_container=true
              app_dir="$(dirname "$container_file")"
              # Docker Hardened Images (dhi.io) require a Docker entitlement —
              # gate the registry login on actually needing it.
              if grep -qi 'dhi\.io' "$container_file"; then
                needs_dhi=true
              else
                needs_dhi=false
              fi
            else
              has_container=false
              app_dir=""
              container_file=""
              needs_dhi=false
            fi

            entries="$(jq -c \
              --arg name "$name" \
              --arg infra_dir "$infra_dir" \
              --argjson container "$has_container" \
              --arg app_dir "$app_dir" \
              --arg container_file "$container_file" \
              --argjson dhi "$needs_dhi" \
              '. + [{"name": $name, "infra_dir": $infra_dir, "container": $container, "app_dir": $app_dir, "container_file": $container_file, "dhi": $dhi}]' \
              <<<"$entries")"
          done
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"

  lint-and-scan:
    name: ${{ matrix.name }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      # Each sample can contain several Terraform roots (e.g. infra/ and
      # infra/bootstrap/) — validate every root found, without a real backend.
      - name: Terraform validate
        working-directory: ${{ matrix.infra_dir }}
        run: |
          for root in $(find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::terraform validate ($root)"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1

      - name: TFLint
        working-directory: ${{ matrix.infra_dir }}
        run: tflint --recursive --call-module-type=all

      - name: KICS scan
        uses: checkmarx/kics-github-action@05aa5eb70eede1355220f4ca5238d96b397e30a6 # v2.1.20
        with:
          path: ${{ matrix.infra_dir }}
          fail_on: high
          exclude_paths: "**/.terraform/**"

      # Docker Hardened Images (used by alb-internal's Containerfile) require
      # an authenticated pull. Configure DHI_USERNAME/DHI_TOKEN as repository
      # secrets to enable it; samples using public base images skip this.
      - name: Login to Docker Hardened Images
        if: matrix.container == true && matrix.dhi == true
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: echo "$DHI_TOKEN" | docker login dhi.io -u "$DHI_USERNAME" --password-stdin

      - name: Build container image
        if: matrix.container == true
        run: docker build -f "${{ matrix.container_file }}" -t "sample-${{ matrix.name }}:ci" "${{ matrix.app_dir }}"

      # Report-only for now: several sample base images carry existing
      # HIGH/CRITICAL CVEs (some with no fix yet). ignore-unfixed keeps the
      # noise down to actionable findings; exit-code 0 keeps the gate green
      # while those get triaged, mirroring the KICS fail_on decision above.
      - name: Trivy image scan
        if: matrix.container == true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sample-${{ matrix.name }}:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
