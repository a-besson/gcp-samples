name: build-gce-g2-gpu-instance

on:
  pull_request:
    paths:
      - "samples/gce-g2-gpu-instance/**"
      - ".github/workflows/_build-sample.yml"
      - ".github/workflows/build-gce-g2-gpu-instance.yml"
      - ".tflint.hcl"

concurrency:
  group: build-gce-g2-gpu-instance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-sample.yml
    with:
      sample: gce-g2-gpu-instance
