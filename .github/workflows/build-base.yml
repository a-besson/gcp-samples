name: build-base

on:
  push:
    paths:
      - "samples/base/**"
      - ".github/workflows/_build-sample.yml"
      - ".github/workflows/build-base.yml"
      - ".tflint.hcl"
  pull_request:
    paths:
      - "samples/base/**"
      - ".github/workflows/_build-sample.yml"
      - ".github/workflows/build-base.yml"
      - ".tflint.hcl"

concurrency:
  group: build-base-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-sample.yml
    with:
      sample: base
