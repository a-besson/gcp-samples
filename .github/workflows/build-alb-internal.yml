name: build-alb-internal

on:
  pull_request:
    paths:
      - "samples/alb-internal/**"
      - ".github/workflows/_build-sample.yml"
      - ".github/workflows/build-alb-internal.yml"
      - ".tflint.hcl"

concurrency:
  group: build-alb-internal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-sample.yml
    with:
      sample: alb-internal
      terraform-test: true
      java: true
