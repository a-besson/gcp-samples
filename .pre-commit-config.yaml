# Quality gates: `pre-commit run --all-files` must be green before any commit.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # TFDOCS.md is generated by terraform_docs: never reformatted by these hooks
      - id: trailing-whitespace
        exclude: (^|/)TFDOCS\.md$
      - id: end-of-file-fixer
        exclude: (^|/)TFDOCS\.md$
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key

  # Advanced secret scanning with gitleaks
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Terraform formatting
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
        args:
          - --args=-recursive
      - id: terraform_validate
        args:
          - --args=-no-color
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=../TFDOCS.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
          - --args=--call-module-type=all

  # Conventional Commits (feat, fix, chore, docs, refactor, test)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, docs, refactor, test]

default_language_version:
  python: python3
