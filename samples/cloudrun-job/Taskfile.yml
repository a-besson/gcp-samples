version: '3'

dotenv:
  - ../../.env

vars:
  NAME_SUFFIX: '{{.TF_VAR_name_suffix | default "-sample"}}'
  SA_IAC: "sa-iac{{.NAME_SUFFIX}}@{{.PROJECT_ID}}.iam.gserviceaccount.com"
  REPO_NAME: "cloudrun-simple-job{{.NAME_SUFFIX}}"
  IMAGE_NAME: "{{.REGION}}-docker.pkg.dev/{{.PROJECT_ID}}/{{.REPO_NAME}}/job:latest"

env:
  GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: "{{.SA_IAC}}"
  CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT: "{{.SA_IAC}}"
  TF_VAR_name_suffix: "{{.NAME_SUFFIX}}"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: "Create GCS state bucket and Artifact Registry (idempotent)"
    cmds:
      - gsutil mb -p {{.PROJECT_ID}} -l {{.REGION}} gs://{{.PROJECT_ID}}-tfstate || true
      - gsutil versioning set on gs://{{.PROJECT_ID}}-tfstate
      - gcloud artifacts repositories create {{.REPO_NAME}} --repository-format=docker --location={{.REGION}} --description="Simple Job Repo" --project={{.PROJECT_ID}} || true

  build:
    desc: "Build and push the Docker image to Artifact Registry"
    dir: app
    deps: [setup]
    cmds:
      - gcloud auth print-access-token | podman login -u oauth2accesstoken --password-stdin {{.REGION}}-docker.pkg.dev
      - podman build --platform linux/amd64 -t {{.IMAGE_NAME}} .
      - podman push {{.IMAGE_NAME}}

  init:
    desc: Initialize Terraform with GCS backend
    dir: infra
    cmds:
      - |
        terraform init \
          -backend-config="bucket=${PROJECT_ID}-tfstate" \
          -backend-config="prefix=cloudrun-simple-job" \
          -reconfigure {{.CLI_ARGS}}

  plan:
    desc: Plan Terraform changes
    dir: infra
    deps: [init]
    cmds:
      - terraform plan -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="image_job={{.IMAGE_NAME}}"

  apply:
    desc: Apply Terraform changes
    dir: infra
    deps: [init, build]
    cmds:
      - terraform apply --auto-approve -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="image_job={{.IMAGE_NAME}}"

  destroy:
    desc: Destroy Terraform resources
    dir: infra
    deps: [init]
    cmds:
      - terraform destroy --auto-approve -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="image_job={{.IMAGE_NAME}}"

  test:
    desc: Run Terraform tests
    dir: infra
    deps: [init]
    cmds:
      - terraform test -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="image_job={{.IMAGE_NAME}}"

  review:
    desc: Run pre-commit hooks on all files
    cmds:
      - pre-commit run --all-files
