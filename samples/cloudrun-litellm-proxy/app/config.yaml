# LiteLLM proxy config — OpenAI-compatible front, Vertex AI back.
# Auth: callers send `Authorization: Bearer <virtual-key>` (sk-...).
# Virtual Keys are managed by LiteLLM against the Postgres DATABASE_URL.
#
# Inference regions:
#   Gemini + Claude → "eu" (EU multi-region, routes to nearest EU datacenter)
#   Gemma           → europe-west4 (Vertex AI Model Garden GPU endpoint)

model_list:
  # ─── Gemini 2.5 Pro ────────────────────────────────────────────────────────
  # Priorité 1 : Mono-région (europe-west1)
  - model_name: gemini-2.5-pro
    litellm_params:
      model: vertex_ai/gemini-2.5-pro
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: europe-west1
      stream: true
  # Fallback 1 : Mono-région (Belgique)
  - model_name: gemini-2.5-pro-fallback-1
    litellm_params:
      model: vertex_ai/gemini-2.5-pro
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: europe-west1
      stream: true
  # Fallback 2 : Mono-région (Pays-Bas)
  - model_name: gemini-2.5-pro-fallback-2
    litellm_params:
      model: vertex_ai/gemini-2.5-pro
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: europe-west4
      stream: true

  # ─── Gemini 2.5 Flash ──────────────────────────────────────────────────────
  - model_name: gemini-2.5-flash
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: europe-west1
      stream: true
  - model_name: gemini-2.5-flash-fallback-1
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: europe-west1
      stream: true
  - model_name: gemini-2.5-flash-fallback-2
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: europe-west4
      stream: true

  # ─── Gemini 3.5 Flash ──────────────────────────────────────────────────────
  - model_name: gemini-3.5-flash
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: eu
      stream: true

  # ─── Claude / Anthropic via Vertex AI ──────────────────────────────────────
  # Claude Opus 4.7
  - model_name: claude-opus-4-7
    litellm_params:
      model: vertex_ai/claude-opus-4@20250514
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: europe-west1
      stream: true
  - model_name: claude-opus-4-7-fallback
    litellm_params:
      model: vertex_ai/claude-opus-4@20250514
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: europe-west1
      stream: true

  # ATTENTION : Remplacement de "global" par des mono-régions EU.
  # Garantit que les requêtes ne transitent pas par l'Amérique du Nord.
  
  # Claude Opus 4.6
  - model_name: claude-opus-4-6
    litellm_params:
      model: vertex_ai/claude-opus-4-6
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: europe-west1
      stream: true
  - model_name: claude-opus-4-6-fallback
    litellm_params:
      model: vertex_ai/claude-opus-4-6
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: europe-west4
      stream: true

  # Claude Sonnet 4.6
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: vertex_ai/claude-sonnet-4-6
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: europe-west1
      stream: true
  - model_name: claude-sonnet-4-6-fallback
    litellm_params:
      model: vertex_ai/claude-sonnet-4-6
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: europe-west4
      stream: true

  # Claude Haiku 4.5
  - model_name: claude-haiku-4-5
    litellm_params:
      model: vertex_ai/claude-haiku-3-5@20241022
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: europe-west1
      stream: true
  - model_name: claude-haiku-4-5-fallback
    litellm_params:
      model: vertex_ai/claude-haiku-3-5@20241022
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: europe-west4
      stream: true



# ─── Moteur de Routage (Load Balancing & Résilience) ────────────────────────
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2                   # Nombre de tentatives avant échec définitif de la requête
  allowed_fails: 3                 # Circuit-Breaker: Retire une région de la rotation après 3 échecs consécutifs
  cooldown_time: 60                # Attente (en sec) avant de réintégrer la région défaillante
  
  # Configuration de la cascade (Multi-région -> Mono-région 1 -> Mono-région 2)
  fallback_dict:
    gemini-2.5-pro: ["gemini-2.5-pro-fallback-1", "gemini-2.5-pro-fallback-2"]
    gemini-2.5-flash: ["gemini-2.5-flash-fallback-1", "gemini-2.5-flash-fallback-2"]
    claude-opus-4-7: ["claude-opus-4-7-fallback"]
    claude-opus-4-6: ["claude-opus-4-6-fallback"]
    claude-sonnet-4-6: ["claude-sonnet-4-6-fallback"]
    claude-haiku-4-5: ["claude-haiku-4-5-fallback"]

litellm_settings:
  success_callback: ["bigquery"]
  cache: true
  cache_params:
    type: local
  drop_params: true
  num_retries: 2
  request_timeout: 60
  telemetry: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  json_logs: true
  disable_spend_logs: false
  litellm_key_header_name: "x-api-key"
