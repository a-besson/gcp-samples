# LiteLLM Virtual Key configuration — managed by Terraform.
# Each entry creates a virtual API key with budget and model constraints.
#
# Fields:
#   name     — User alias (used as key_alias and metadata.user)
#   budget   — Max budget in USD for the budget cycle
#   duration — Budget renewal cycle (e.g. "7d", "30d", "1h")
#   models   — (Optional) Allowed model aliases. Empty or omitted = all models.
#
# After editing this file, run `task apply` to synchronize keys.

users:
  - name: alice
    budget: 10
    duration: 7d
    models:
      - claude-sonnet-4-6
      - gemini-2.5-flash
  - name: bob
    budget: 20
    duration: 30d
    # No models restriction → access to all available models
