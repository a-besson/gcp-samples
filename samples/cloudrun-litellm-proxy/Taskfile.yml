version: '3'

dotenv:
  - ../../.env

vars:
  NAME_SUFFIX: '{{.TF_VAR_name_suffix | default "-sample"}}'
  SA_IAC: "sa-iac{{.NAME_SUFFIX}}@{{.PROJECT_ID}}.iam.gserviceaccount.com"
  REPO_NAME: "litellm-proxy{{.NAME_SUFFIX}}"
  IMAGE_NAME: "{{.REGION}}-docker.pkg.dev/{{.PROJECT_ID}}/{{.REPO_NAME}}/litellm:latest"
  STATE_PREFIX: "cloudrun-litellm-proxy"
  BQ_DATASET: "litellm_observability"

env:
  GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: "{{.SA_IAC}}"
  CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT: "{{.SA_IAC}}"
  TF_VAR_name_suffix: "{{.NAME_SUFFIX}}"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: "Create GCS state bucket and Artifact Registry (idempotent)"
    cmds:
      - |
        BUCKET_NAME="{{.PROJECT_ID}}-tfstate";
        if ! gcloud storage buckets describe gs://${BUCKET_NAME} --project {{.PROJECT_ID}} > /dev/null 2>&1; then
          echo "Creating bucket gs://${BUCKET_NAME}...";
          gcloud storage buckets create gs://${BUCKET_NAME} --project {{.PROJECT_ID}} --location {{.REGION}} --uniform-bucket-level-access;
          gcloud storage buckets update gs://${BUCKET_NAME} --versioning;
        else
          echo "Bucket gs://${BUCKET_NAME} already exists.";
        fi
      - gcloud artifacts repositories create {{.REPO_NAME}} --repository-format=docker --location={{.REGION}} --description="LiteLLM Proxy images" --project={{.PROJECT_ID}} || true

  seed-key:
    desc: "Generate and store LITELLM_MASTER_KEY in Secret Manager (run once before apply)"
    cmds:
      - gcloud secrets create litellm-master-key{{.NAME_SUFFIX}} --replication-policy=user-managed --locations={{.REGION}} --project={{.PROJECT_ID}} || true
      - |
        printf "sk-%s" "$(openssl rand -hex 32)" | \
          gcloud secrets versions add litellm-master-key{{.NAME_SUFFIX}} --data-file=- --project={{.PROJECT_ID}}

  build:
    desc: "Build and push the LiteLLM Docker image to Artifact Registry"
    dir: app
    deps: [setup]
    cmds:
      - gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin {{.REGION}}-docker.pkg.dev
      - docker build --platform linux/amd64 -t {{.IMAGE_NAME}} .
      - docker push {{.IMAGE_NAME}}

  init:
    desc: "Initialize Terraform with GCS backend"
    dir: infra
    cmds:
      - |
        terraform init \
          -backend-config="bucket=${PROJECT_ID}-tfstate" \
          -backend-config="prefix={{.STATE_PREFIX}}" \
          -reconfigure {{.CLI_ARGS}}

  plan:
    desc: "Plan Terraform changes"
    dir: infra
    deps: [init]
    cmds:
      - terraform plan -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="image_service={{.IMAGE_NAME}}"

  apply:
    desc: "Apply Terraform — provision Cloud SQL, Cloud Run, DNS, secrets"
    dir: infra
    deps: [init, build]
    cmds:
      - terraform apply --auto-approve -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="image_service={{.IMAGE_NAME}}"

  provision-key:
    desc: "Create a LiteLLM Virtual Key for a user (args: USER=alice MAX_BUDGET=10)"
    dir: infra
    vars:
      USER: '{{.USER | default "default-user"}}'
      MAX_BUDGET: '{{.MAX_BUDGET | default "10"}}'
    cmds:
      - |
        SERVICE_URL=$(terraform output -raw service_url)
        MASTER_KEY=$(gcloud secrets versions access latest --secret=litellm-master-key{{.NAME_SUFFIX}} --project={{.PROJECT_ID}})
        curl -sS -X POST "${SERVICE_URL}/key/generate" \
          -H "x-api-key: Bearer ${MASTER_KEY}" \
          -H "Content-Type: application/json" \
          -d "{
            \"key_alias\": \"{{.USER}}\",
            \"max_budget\": {{.MAX_BUDGET}},
            \"budget_duration\": \"7d\",
            \"models\": [
              \"gemini-2.5-flash\", \"gemini-2.5-pro\",
              \"claude-opus-4-7\", \"claude-opus-4-6\",
              \"claude-sonnet-4-6\", \"claude-haiku-4-5\",
              \"gemma-3-1b\", \"gemma-3-27b\"
            ],
            \"metadata\": {\"user\": \"{{.USER}}\"}
          }" | jq .

  smoke:
    desc: "End-to-end smoke test — verifies Gemini, Claude Sonnet 4-6, and Gemma via virtual key"
    dir: infra
    cmds:
      - |
        set -euo pipefail
        SERVICE_URL=$(terraform output -raw service_url)
        MASTER_KEY=$(gcloud secrets versions access latest --secret=litellm-master-key{{.NAME_SUFFIX}} --project={{.PROJECT_ID}})

        # ── Create a temporary test key ──────────────────────────────────────
        echo -e "\n🔑 Creating temporary virtual key..."
        VKEY=$(curl -sS -X POST "${SERVICE_URL}/key/generate" \
          -H "x-api-key: Bearer ${MASTER_KEY}" \
          -H "Content-Type: application/json" \
          -d "{\"key_alias\":\"smoke-test-$(date +%s)\",\"max_budget\":1,\"budget_duration\":\"1d\"}" \
          | jq -r .key)

        if [ -z "${VKEY}" ] || [ "${VKEY}" = "null" ]; then
          echo "❌ Failed to generate virtual key"; exit 1
        fi
        echo "   ✅ Virtual key created"

        # ── Test each model family ───────────────────────────────────────────
        MODELS=("gemini-2.5-flash" "gemini-3.5-flash" "gemini-2.5-pro")
        PASS=0
        FAIL=0

        for MODEL in "${MODELS[@]}"; do
          echo -e "\n🤖 Testing model: \033[1m${MODEL}\033[0m"
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${SERVICE_URL}/v1/chat/completions" \
            -H "x-api-key: Bearer ${VKEY}" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"${MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with the single word: OK\"}]}")

          HTTP_CODE=$(echo "${RESPONSE}" | tail -n1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          if [ "${HTTP_CODE}" = "200" ]; then
            CONTENT=$(echo "${BODY}" | jq -r '.choices[0].message.content // empty')
            if [ -n "${CONTENT}" ]; then
              echo "   ✅ HTTP ${HTTP_CODE} — Response: ${CONTENT}"
              PASS=$((PASS + 1))
            else
              echo "   ❌ HTTP ${HTTP_CODE} — Empty response body"
              echo "${BODY}" | jq .
              FAIL=$((FAIL + 1))
            fi
          else
            echo "   ❌ HTTP ${HTTP_CODE}"
            echo "${BODY}" | jq -r '.error.message // .' 2>/dev/null | head -n 3
            FAIL=$((FAIL + 1))
          fi
        done

        # ── Summary ──────────────────────────────────────────────────────────
        TOTAL=$((PASS + FAIL))
        echo -e "\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo -e "📊 Smoke test results: \033[32m${PASS}/${TOTAL} passed\033[0m"
        if [ "${FAIL}" -gt 0 ]; then
          echo -e "   \033[31m${FAIL} model(s) failed\033[0m"
          exit 1
        fi
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  query-spend:
    desc: "Query BigQuery for per-model token and cost usage (last 7 days)"
    cmds:
      - |
        bq query --project_id={{.PROJECT_ID}} --use_legacy_sql=false \
          'SELECT
             DATE(created_at)        AS day,
             model,
             key_alias,
             SUM(input_tokens)       AS read_tokens,
             SUM(output_tokens)      AS write_tokens,
             ROUND(SUM(spend), 6)    AS cost_usd,
             ROUND(AVG(response_ms)) AS avg_latency_ms
           FROM `{{.PROJECT_ID}}.{{.BQ_DATASET}}.litellm_logs`
           WHERE created_at >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 7 DAY)
           GROUP BY 1, 2, 3
           ORDER BY day DESC, cost_usd DESC
           LIMIT 50'

  review:
    desc: "Run pre-commit hooks on all files (fmt, validate, tflint, tfdocs)"
    cmds:
      - pre-commit run --all-files

  destroy:
    desc: "Destroy all resources (WARNING: deletes Cloud SQL data)"
    dir: infra
    deps: [init]
    cmds:
      - terraform destroy --auto-approve -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="image_service={{.IMAGE_NAME}}"
