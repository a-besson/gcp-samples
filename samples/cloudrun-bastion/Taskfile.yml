version: '3'

dotenv:
  - ../../.env


vars:
  NAME_SUFFIX: '{{.TF_VAR_name_suffix | default "-sample"}}'
  SA_IAC: "sa-iac{{.NAME_SUFFIX}}@{{.PROJECT_ID}}.iam.gserviceaccount.com"
  ENVIRONMENT: cloudrun-bastion
  REPO_NAME: "cloudrun-bastion{{.NAME_SUFFIX}}"
  IMAGE_NAME: "{{.REGION}}-docker.pkg.dev/{{.PROJECT_ID}}/{{.REPO_NAME}}/bastion:latest"
  IAP_USER_EMAIL: "{{.TF_VAR_iap_user_email}}"
  ENDPOINT_SERVICE: "bastion{{.NAME_SUFFIX}}.endpoints.{{.PROJECT_ID}}.cloud.goog"
  # Jump host for the private Cloud SQL instance: test VM A of samples/base
  # (same name_suffix and region), reachable through IAP TCP forwarding.
  JUMP_VM: "vm-test-a{{.NAME_SUFFIX}}"
  JUMP_ZONE: "{{.REGION}}-a"

env:
  GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: "{{.SA_IAC}}"
  CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT: "{{.SA_IAC}}"
  TF_VAR_name_suffix: "{{.NAME_SUFFIX}}"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: "Create GCS state bucket and Artifact Registry (idempotent)"
    cmds:
      - gsutil mb -p {{.PROJECT_ID}} -l {{.REGION}} gs://{{.PROJECT_ID}}-tfstate || true
      - gsutil versioning set on gs://{{.PROJECT_ID}}-tfstate
      # Artifact Registry is also managed by TF, but we need it for the first build
      - gcloud artifacts repositories create {{.REPO_NAME}} --repository-format=docker --location={{.REGION}} --description="Bastion Repo" --project={{.PROJECT_ID}} || true

  build:
    desc: "Build and push the Docker image to Artifact Registry"
    dir: app
    deps: [setup]
    cmds:
      - gcloud auth print-access-token | podman login -u oauth2accesstoken --password-stdin {{.REGION}}-docker.pkg.dev
      - podman build --platform linux/amd64 -t {{.IMAGE_NAME}} .
      - podman push {{.IMAGE_NAME}}

  init:
    desc: "Initialize Terraform with GCS backend"
    dir: infra
    cmds:
      - |
        terraform init \
          -backend-config="bucket={{.PROJECT_ID}}-tfstate" \
          -backend-config="prefix=cloudrun-bastion" \
          -reconfigure {{.CLI_ARGS}}

  plan:
    desc: "Plan Terraform changes"
    dir: infra
    deps: [init]
    cmds:
      - terraform plan -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="name_suffix={{.NAME_SUFFIX}}" -var="iap_user_email={{.IAP_USER_EMAIL}}"

  apply:
    desc: "Apply Terraform changes"
    dir: infra
    deps: [init, undelete-dns, build]
    cmds:
      - terraform apply --auto-approve -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="name_suffix={{.NAME_SUFFIX}}" -var="iap_user_email={{.IAP_USER_EMAIL}}"

  undelete-dns:
    desc: "Undelete the Cloud Endpoints service if it's in a soft-deleted state"
    cmds:
      - gcloud endpoints services undelete {{.ENDPOINT_SERVICE}} --project={{.PROJECT_ID}} 2>/dev/null || true

  destroy:
    desc: "Destroy Terraform resources"
    dir: infra
    deps: [init]
    cmds:
      - terraform destroy --auto-approve -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="name_suffix={{.NAME_SUFFIX}}" -var="iap_user_email={{.IAP_USER_EMAIL}}"

  test:
    desc: "Run Terraform tests"
    dir: infra
    deps: [init]
    cmds:
      - terraform test -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="name_suffix={{.NAME_SUFFIX}}" -var="iap_user_email={{.IAP_USER_EMAIL}}"

  review:
    desc: "Run pre-commit hooks on all files"
    cmds:
      - pre-commit run --all-files

  cyber-scan:
    desc: "Run security scans: KICS on infra/, Trivy on the built image"
    deps: [build]
    cmds:
      - kics scan -p infra --exclude-paths "**/.terraform/**"
      - trivy image --severity HIGH,CRITICAL --ignore-unfixed {{.IMAGE_NAME}}

  bastion-run:
    desc: "Run the Bastion container locally for testing (Port 1080 -> 8080)"
    cmds:
      - echo "Starting Bastion (HTTP proxy) on http://localhost:1080"
      - podman run -p 1080:8080 --name cloudrun-bastion-test --rm {{.IMAGE_NAME}}

  test-local:
    desc: "Test the local bastion using curl"
    cmds:
      - curl -v -x http://localhost:1080 http://google.com

  db-proxy:
    desc: "Forward localhost:5432 to the private Cloud SQL IP through an IAP SSH tunnel to the base test VM"
    # Runs as the operator, not sa-iac (global env of this Taskfile): OS Login
    # and IAP TCP forwarding to the base VMs are operator permissions.
    env:
      GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: ""
      CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT: ""
    cmds:
      - |
        DB_IP=$(cd infra && terraform output -raw db_instance_ip)
        echo "Forwarding localhost:5432 to $DB_IP:5432 through {{.JUMP_VM}} (Ctrl+C to stop)..."
        gcloud compute ssh {{.JUMP_VM}} --zone={{.JUMP_ZONE}} --project={{.PROJECT_ID}} --tunnel-through-iap -- -N -L 5432:$DB_IP:5432
