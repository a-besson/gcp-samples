version: '3'

dotenv:
  - ../../.env


vars:
  ENVIRONMENT: cloudrun-bastion
  REPO_NAME: cloudrun-bastion
  IMAGE_NAME: "{{.REGION}}-docker.pkg.dev/{{.PROJECT_ID}}/{{.REPO_NAME}}/bastion:latest"
  PROJECT_NUMBER: "{{.TF_VAR_project_number}}"
  NAME_SUFFIX: "{{.TF_VAR_name_suffix}}"
  IAP_USER_EMAIL: "{{.TF_VAR_iap_user_email}}"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: "Create GCS state bucket and Artifact Registry (idempotent)"
    cmds:
      - gsutil mb -p {{.PROJECT_ID}} -l {{.REGION}} gs://{{.PROJECT_ID}}-tfstate || true
      - gsutil versioning set on gs://{{.PROJECT_ID}}-tfstate
      # Artifact Registry is also managed by TF, but we need it for the first build
      - gcloud artifacts repositories create {{.REPO_NAME}} --repository-format=docker --location={{.REGION}} --description="Bastion Repo" || true

  build:
    desc: "Build and push the Docker image to Artifact Registry"
    dir: app
    cmds:
      - gcloud auth print-access-token | podman login -u oauth2accesstoken --password-stdin {{.REGION}}-docker.pkg.dev
      - podman build --platform linux/amd64 -t {{.IMAGE_NAME}} .
      - podman push {{.IMAGE_NAME}}

  init:
    desc: "Initialize Terraform with GCS backend"
    dir: infra
    cmds:
      - |
        terraform init \
          -backend-config="bucket={{.PROJECT_ID}}-tfstate" \
          -backend-config="prefix=cloudrun-bastion" \
          -reconfigure {{.CLI_ARGS}}

  plan:
    desc: "Plan Terraform changes"
    dir: infra
    deps: [init]
    cmds:
      - terraform plan -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="project_number={{.PROJECT_NUMBER}}" -var="name_suffix={{.NAME_SUFFIX}}" -var="iap_user_email={{.IAP_USER_EMAIL}}"

  apply:
    desc: "Apply Terraform changes"
    dir: infra
    deps: [init]
    cmds:
      - terraform apply --auto-approve -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="project_number={{.PROJECT_NUMBER}}" -var="name_suffix={{.NAME_SUFFIX}}" -var="iap_user_email={{.IAP_USER_EMAIL}}"

  destroy:
    desc: "Destroy Terraform resources"
    dir: infra
    deps: [init]
    cmds:
      - terraform destroy --auto-approve -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="project_number={{.PROJECT_NUMBER}}" -var="name_suffix={{.NAME_SUFFIX}}" -var="iap_user_email={{.IAP_USER_EMAIL}}"

  test:
    desc: "Run Terraform tests"
    dir: infra
    deps: [init]
    cmds:
      - terraform test -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="project_number={{.PROJECT_NUMBER}}" -var="name_suffix={{.NAME_SUFFIX}}" -var="iap_user_email={{.IAP_USER_EMAIL}}"

  review:
    desc: "Run pre-commit hooks on all files"
    cmds:
      - pre-commit run --all-files

  bastion-run:
    desc: "Run the Bastion container locally for testing (Port 1080 -> 8080)"
    cmds:
      - echo "Starting Bastion on socks5h://localhost:1080"
      - podman run -p 1080:8080 --name cloudrun-bastion-test --rm {{.IMAGE_NAME}}

  test-local:
    desc: "Test the local bastion using curl"
    cmds:
      - curl -v -x http://localhost:1080 http://google.com

  db-proxy:
    desc: "Start Cloud SQL Auth Proxy (Industrial SOCKS/TCP tunnel)"
    cmds:
      - echo "Starting Cloud SQL Auth Proxy for {{.PROJECT_ID}}..."
      - |
        CONNECTION_NAME=$(cd infra && terraform output -raw db_instance_connection_name)
        cloud-sql-proxy $CONNECTION_NAME --port 5432
