# Tinyproxy configuration for Cloud Run bastion
# HTTP forward proxy (the GCLB does not relay CONNECT, see the README)

Port 8080
Listen 0.0.0.0

# Timeout for idle connections
Timeout 600

# Allow all connections (Authentication handled by IAP)
Allow 0.0.0.0/0

# Log to stdout for Cloud Run Logs
LogLevel Info

# Disable the Via header for stealth/compliance
DisableViaHeader Yes

# No ConnectPort restrictions - allows tunneling to any target port (e.g. 5432)
# If ConnectPort is not specified, all ports are allowed by default in Tinyproxy.
