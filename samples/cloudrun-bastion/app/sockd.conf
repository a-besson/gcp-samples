# Dante SOCKS5 server configuration for Cloud Run bastion
# Authentication is handled upstream by IAP — no credentials required here.

# Log to stdout so Cloud Run can collect logs
logoutput: /dev/stdout

# Listen on all interfaces, port 8080 (Cloud Run requirement)
internal: 0.0.0.0 port = 8080

# Use eth0 as the outbound interface toward the VPC
external: eth0

# No client-level authentication (IAP handles it before reaching this container)
clientmethod: none

# No SOCKS-level authentication
socksmethod: none

user.privileged: root
user.notprivileged: nobody

# Allow all clients coming from the Cloud Run network namespace
client pass {
  from: 0.0.0.0/0 to: 0.0.0.0/0
  log: connect disconnect error
}

# Forward all TCP traffic to the VPC
socks pass {
  from: 0.0.0.0/0 to: 0.0.0.0/0
  protocol: tcp
  log: connect disconnect error
}
