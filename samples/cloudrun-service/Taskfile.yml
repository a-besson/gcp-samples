version: '3'

dotenv:
  - ../../.env


vars:
  NAME_SUFFIX: '{{.TF_VAR_name_suffix | default "-sample"}}'
  SA_IAC: "sa-iac{{.NAME_SUFFIX}}@{{.PROJECT_ID}}.iam.gserviceaccount.com"
  REPO_NAME: "cloudrun-simple-service{{.NAME_SUFFIX}}"
  # Tag pushed by `task build`; plan/apply resolve it to its digest with
  # gcloud, so every push changes the configuration and rolls a new revision
  # (a constant ":latest" string never shows a diff).
  IMAGE_NAME: "{{.REGION}}-docker.pkg.dev/{{.PROJECT_ID}}/{{.REPO_NAME}}/service:latest"
  ENDPOINT_SERVICE: "exposed-service{{.NAME_SUFFIX}}.endpoints.{{.PROJECT_ID}}.cloud.goog"

env:
  GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: "{{.SA_IAC}}"
  CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT: "{{.SA_IAC}}"
  TF_VAR_name_suffix: "{{.NAME_SUFFIX}}"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: "Create GCS state bucket and Artifact Registry (idempotent)"
    cmds:
      - gsutil mb -p {{.PROJECT_ID}} -l {{.REGION}} gs://{{.PROJECT_ID}}-tfstate || true
      - gsutil versioning set on gs://{{.PROJECT_ID}}-tfstate
      # Artifact Registry is also managed by TF, but we need it for the first build
      - gcloud artifacts repositories create {{.REPO_NAME}} --repository-format=docker --location={{.REGION}} --description="SSL Service Repo" --project={{.PROJECT_ID}} || true

  build:
    desc: "Build and push the Docker image to Artifact Registry"
    dir: app
    deps: [setup]
    cmds:
      - gcloud auth print-access-token | podman login -u oauth2accesstoken --password-stdin {{.REGION}}-docker.pkg.dev
      - podman build --platform linux/amd64 -t {{.IMAGE_NAME}} .
      - podman push {{.IMAGE_NAME}}

  init:
    desc: "Initialize Terraform with GCS backend"
    dir: infra
    cmds:
      - |
        terraform init \
          -backend-config="bucket=${PROJECT_ID}-tfstate" \
          -backend-config="prefix=cloudrun-ssl-service" \
          -reconfigure {{.CLI_ARGS}}

  plan:
    desc: "Plan Terraform changes"
    dir: infra
    deps: [init]
    cmds:
      - terraform plan -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="image_service=$(gcloud artifacts docker images describe {{.IMAGE_NAME}} --format='value(image_summary.fully_qualified_digest)')"

  apply:
    desc: "Apply Terraform changes"
    dir: infra
    deps: [init, undelete-dns, build]
    cmds:
      - terraform apply --auto-approve -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="image_service=$(gcloud artifacts docker images describe {{.IMAGE_NAME}} --format='value(image_summary.fully_qualified_digest)')"

  undelete-dns:
    desc: "Undelete the Cloud Endpoints service if it's in a soft-deleted state"
    cmds:
      - gcloud endpoints services undelete {{.ENDPOINT_SERVICE}} --project={{.PROJECT_ID}} 2>/dev/null || true

  test:
    desc: "Run the Terraform tests offline (mock_provider, no GCP credentials needed)"
    dir: infra
    cmds:
      - terraform init -backend=false -input=false
      - terraform test

  e2e:
    desc: "Test E2E sur l'infra déjà déployée : exposed-service refuse un appel non authentifié (403) et accepte un jeton test_sa (200), en direct et via le Load Balancer HTTPS."
    dir: infra
    # Doit tourner sous l'identité réelle de l'opérateur, pas sous sa-iac
    # (env global du Taskfile) : c'est l'opérateur qui a été autorisé à
    # usurper test_sa (iam.tf), pas sa-iac.
    env:
      GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: ""
      CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT: ""
    cmds:
      - |
        set -e
        EXPOSED_URL=$(terraform output -raw exposed_service_url)
        LB_URL=$(terraform output -raw load_balancer_url)
        TESTER_SA=$(terraform output -raw tester_sa_email)

        echo '--- 1. Sans jeton (attendu: 403) ---'
        curl -sk -o /dev/null -w '%{http_code}\n' "$EXPOSED_URL"

        TOKEN=$(gcloud auth print-identity-token --impersonate-service-account="$TESTER_SA" --audiences="$EXPOSED_URL")

        echo '--- 2. Avec jeton, en direct (attendu: 200) ---'
        curl -sk -H "Authorization: Bearer $TOKEN" -w '\n%{http_code}\n' "$EXPOSED_URL"

        echo '--- 3. Avec jeton, via le Load Balancer HTTPS (attendu: 200 ; le certificat géré peut prendre jusqu'\''à 60 min après un premier apply) ---'
        curl -s -H "Authorization: Bearer $TOKEN" -w '\n%{http_code}\n' "$LB_URL"

  destroy:
    desc: "Destroy resources"
    dir: infra
    deps: [init]
    cmds:
      - terraform destroy --auto-approve -var="project_id={{.PROJECT_ID}}" -var="region={{.REGION}}" -var="image_service={{.IMAGE_NAME}}"

  cyber-scan:
    desc: "Run security scans: KICS on infra/, Trivy on the built image"
    deps: [build]
    cmds:
      - kics scan -p infra --exclude-paths "**/.terraform/**"
      - trivy image --severity HIGH,CRITICAL --ignore-unfixed {{.IMAGE_NAME}}
