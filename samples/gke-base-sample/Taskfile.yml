version: '3'

dotenv:
  - ../../.env

vars:
  NAME_SUFFIX: '{{.TF_VAR_name_suffix | default "-sample"}}'
  SA_IAC: "sa-iac{{.NAME_SUFFIX}}@{{.PROJECT_ID}}.iam.gserviceaccount.com"
  CLUSTER_NAME: "gke-autopilot{{.NAME_SUFFIX}}"

env:
  GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: "{{.SA_IAC}}"
  CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT: "{{.SA_IAC}}"
  TF_VAR_name_suffix: "{{.NAME_SUFFIX}}"

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  setup:
    desc: "Create GCS state bucket (idempotent)"
    cmds:
      - gsutil mb -p {{.PROJECT_ID}} -l {{.REGION}} gs://{{.PROJECT_ID}}-tfstate || true
      - gsutil versioning set on gs://{{.PROJECT_ID}}-tfstate

  init:
    desc: "Initialize Terraform with GCS backend"
    dir: infra
    cmds:
      - |
        terraform init \
          -backend-config="bucket=${PROJECT_ID}-tfstate" \
          -backend-config="prefix=gke-base-sample" \
          -reconfigure {{.CLI_ARGS}}

  plan:
    desc: "Plan Terraform changes"
    dir: infra
    deps: [init]
    cmds:
      - terraform plan

  apply:
    desc: "Apply Terraform changes and deploy GKE Autopilot cluster"
    dir: infra
    deps: [init]
    cmds:
      - terraform apply --auto-approve

  test:
    desc: "Run Terraform tests"
    dir: infra
    deps: [init]
    cmds:
      - terraform test

  destroy:
    desc: "Destroy all GKE resources"
    dir: infra
    deps: [init]
    cmds:
      - terraform destroy --auto-approve

  cyber-scan:
    desc: "Run KICS security scan on the Terraform IaC"
    cmds:
      - kics scan -p infra --exclude-paths "**/.terraform/**"

  get-credentials:
    desc: "Configure kubectl to connect to the GKE cluster"
    cmds:
      - |
        gcloud container clusters get-credentials {{.CLUSTER_NAME}} \
          --region {{.REGION}} \
          --project {{.PROJECT_ID}}
      - echo "✅ kubectl configured. Run 'kubectl get nodes' to verify."

  deploy-nginx:
    desc: "Deploy the internal nginx service to the GKE cluster"
    deps: [get-credentials]
    cmds:
      - kubectl apply -f k8s/
      - echo "⏳ Waiting for nginx pods to be ready..."
      - kubectl wait --for=condition=ready pod -l app=nginx -n nginx-internal --timeout=120s
      - kubectl get pods -n nginx-internal
      - kubectl get svc -n nginx-internal

  test-nginx:
    desc: "Test nginx connectivity from within the cluster"
    cmds:
      - |
        echo "🔍 Testing nginx from within the cluster..."
        kubectl run curl-test --rm -it --restart=Never \
          --image=curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93 \
          -n nginx-internal \
          -- curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
          http://nginx-internal.nginx-internal.svc.cluster.local

  port-forward:
    desc: "Open a secure local tunnel to nginx via kubectl port-forward"
    cmds:
      - |
        echo "🔒 Forwarding local port 8080 → nginx-internal:80"
        echo "   Access at: http://localhost:8080"
        echo "   Press Ctrl+C to stop."
        kubectl port-forward -n nginx-internal svc/nginx-internal 8080:80

  undeploy-nginx:
    desc: "Remove the nginx deployment from the cluster"
    cmds:
      - kubectl delete -f k8s/ --ignore-not-found
