server:
  port: ${PORT:8080}

spring:
  application:
    name: alb-internal-api
  datasource:
    # The Cloud SQL Auth Proxy sidecar listens on localhost inside the same
    # Cloud Run instance/pod - never a direct connection to Cloud SQL.
    url: jdbc:postgresql://127.0.0.1:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none # the schema is owned by Flyway, never by Hibernate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
