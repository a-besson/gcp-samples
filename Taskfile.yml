version: '3'

dotenv: [.env]

vars:
  BREW_DEPS:
    - node
    - terraform
    - go-task/tap/go-task
    - trivy
    - pre-commit
    - terraform-docs
    - gitleaks
    - libpq
    - kubectl
  # tflint is distributed as a Homebrew cask (terraform-linters/tap), not a
  # formula: `brew install tflint` fails ("No available formula"), and the
  # older `terraform-linters/tflint` tap has been retired (404 on GitHub).
  BREW_CASKS:
    - google-cloud-sdk
    - terraform-linters/tap/tflint

tasks:
  apply-all:
    desc: "Déploie l'intégralité des stacks (base d'abord, puis les services en parallèle)."
    cmds:
      - task: apply-base
      - task: apply-samples

  apply-base:
    internal: true
    cmds:
      - task: terraform-cmd
        vars: { DIR: "samples/base", CMD: "apply" }

  apply-samples:
    internal: true
    cmds:
      - task: terraform-cmd
        vars: { DIR: "samples/alb-internal", CMD: "apply" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-bastion", CMD: "apply" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-job", CMD: "apply" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-service", CMD: "apply" }
      - task: terraform-cmd
        vars: { DIR: "samples/gke-base-sample", CMD: "apply" }
    parallel: true

  destroy-all:
    desc: "Détruit l'intégralité des ressources (services d'abord en parallèle, puis base à la fin)."
    cmds:
      - task: destroy-samples
      - task: wait-for-serverless-cleanup
      - task: destroy-base

  destroy-base:
    internal: true
    cmds:
      - task: terraform-cmd
        vars: { DIR: "samples/base", CMD: "destroy" }

  destroy-samples:
    internal: true
    cmds:
      - task: terraform-cmd
        vars: { DIR: "samples/alb-internal", CMD: "destroy" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-bastion", CMD: "destroy" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-job", CMD: "destroy" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-service", CMD: "destroy" }
      - task: terraform-cmd
        vars: { DIR: "samples/gke-base-sample", CMD: "destroy" }
    parallel: true

  test-all:
    desc: "Exécute tous les tests Terraform du projet en parallèle."
    cmds:
      - task: terraform-cmd
        vars: { DIR: "samples/base", CMD: "test" }
      - task: terraform-cmd
        vars: { DIR: "samples/alb-internal", CMD: "test" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-bastion", CMD: "test" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-job", CMD: "test" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-service", CMD: "test" }
      - task: terraform-cmd
        vars: { DIR: "samples/gke-base-sample", CMD: "test" }
    parallel: true

  terraform-cmd:
    internal: true
    cmds:
      - task --dir {{.DIR}} {{.CMD}}

  wait-for-serverless-cleanup:
    internal: true
    cmds:
      - |
        echo "⏳ Waiting for Cloud Run ephemeral IP addresses (Direct VPC Egress) to be released..."
        TIMEOUT=180
        START_TIME=$(date +%s)
        while true; do
          # Try to list addresses with gcloud
          ADDRESSES=$(gcloud compute addresses list --project ${PROJECT_ID} --filter="name ~ serverless-ipv4" --format="value(name)" 2>/dev/null || echo "GCLOUD_FAILED")
          
          if [ "$ADDRESSES" = "GCLOUD_FAILED" ]; then
            echo "⚠️  gcloud command failed or not authenticated. Falling back to 60s sleep buffer."
            sleep 60
            break
          fi

          if [ -z "$ADDRESSES" ]; then
            echo "✅ All ephemeral IPs released."
            break
          fi
          
          CURRENT_TIME=$(date +%s)
          ELAPSED=$((CURRENT_TIME - START_TIME))
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "⚠️  Timeout reached while waiting for IP release. VPC destruction might still fail."
            break
          fi
          
          # Count addresses for display
          COUNT=$(echo "$ADDRESSES" | wc -l | xargs)
          echo "🔄 Still waiting for $COUNT IP(s) to be released... (elapsed: ${ELAPSED}s)"
          sleep 10
        done

  review:
    desc: "Exécute les contrôles de qualité (pre-commit) et déclenche une revue approfondie par l'agent IA."
    cmds:
      - pre-commit run --all-files

  init:
    desc: "Configuration complète du projet : installation des dépendances système."
    cmds:
      - task: deps-install

  deps-install:
    desc: "Installe les dépendances système via Homebrew (macOS)."
    cmds:
      - for: { var: BREW_DEPS }
        cmd: brew list {{.ITEM}} >/dev/null 2>&1 || brew install {{.ITEM}}
      - for: { var: BREW_CASKS }
        cmd: brew list --cask {{.ITEM}} >/dev/null 2>&1 || brew install --cask {{.ITEM}}

  deps-uninstall:
    desc: "Désinstalle les dépendances système via Homebrew."
    cmds:
      - for: { var: BREW_DEPS }
        cmd: brew uninstall {{.ITEM}} || true
      - for: { var: BREW_CASKS }
        cmd: brew uninstall --cask {{.ITEM}} || true

  default:
    desc: "Liste toutes les commandes du projet."
    cmds:
      - task --list
