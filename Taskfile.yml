version: '3'

dotenv: [.env]

vars:
  SKILLS_CLI: npx -y skills
  SKILLS:
    - new-terraform-provider
    - bahayonghang/drawio-skills@drawio
    - provider-resources
    - provider-actions
    - refactor-module
    - terraform-style-guide
    - terraform-stacks
    - terraform-test
    - psql-shell

  BREW_DEPS:
    - node
    - terraform
    - go-task/tap/go-task
    - trivy
    - pre-commit
    - tflint
    - terraform-docs
    - gitleaks
    - libpq
  BREW_CASKS:
    - google-cloud-sdk

tasks:
  apply-all:
    desc: "Déploie l'intégralité des stacks (base d'abord, puis les services en parallèle)."
    cmds:
      - task: apply-base
      - task: apply-samples

  apply-base:
    internal: true
    cmds:
      - task: terraform-cmd
        vars: { DIR: "samples/base", CMD: "apply" }

  apply-samples:
    internal: true
    cmds:
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-bastion", CMD: "apply" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-simple-job", CMD: "apply" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-simple-service", CMD: "apply" }
    parallel: true

  destroy-all:
    desc: "Détruit l'intégralité des ressources (services d'abord en parallèle, puis base à la fin)."
    cmds:
      - task: destroy-samples
      - task: destroy-base

  destroy-base:
    internal: true
    cmds:
      - task: terraform-cmd
        vars: { DIR: "samples/base", CMD: "destroy" }

  destroy-samples:
    internal: true
    cmds:
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-bastion", CMD: "destroy" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-simple-job", CMD: "destroy" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-simple-service", CMD: "destroy" }
    parallel: true

  test-all:
    desc: "Exécute tous les tests Terraform du projet en parallèle."
    cmds:
      - task: terraform-cmd
        vars: { DIR: "samples/base", CMD: "test" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-bastion", CMD: "test" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-simple-job", CMD: "test" }
      - task: terraform-cmd
        vars: { DIR: "samples/cloudrun-simple-service", CMD: "test" }
    parallel: true

  terraform-cmd:
    internal: true
    cmds:
      - task --dir {{.DIR}} {{.CMD}}

  review:
    desc: "Exécute les contrôles de qualité (pre-commit) et déclenche une revue approfondie par l'agent IA."
    cmds:
      - pre-commit run --all-files

  init:
    desc: "Configuration complète du projet : installation des dépendances système et des skills IA."
    cmds:
      - task: deps-install
      - task: skills

  deps-install:
    desc: "Installe les dépendances système via Homebrew (macOS)."
    cmds:
      - for: { var: BREW_DEPS }
        cmd: brew list {{.ITEM}} >/dev/null 2>&1 || brew install {{.ITEM}}
      - for: { var: BREW_CASKS }
        cmd: brew list --cask {{.ITEM}} >/dev/null 2>&1 || brew install --cask {{.ITEM}}

  deps-uninstall:
    desc: "Désinstalle les dépendances système via Homebrew."
    cmds:
      - for: { var: BREW_DEPS }
        cmd: brew uninstall {{.ITEM}} || true
      - for: { var: BREW_CASKS }
        cmd: brew uninstall --cask {{.ITEM}} || true

  skills:
    desc: "Installe et met à jour les dépendances skills IA (uniquement pour l'agent antigravity)."
    cmds:
      - cmd: mkdir -p .agents/skills/community
      - for: { var: SKILLS }
        cmd: "{{.SKILLS_CLI}} add hashicorp/agent-skills --skill {{.ITEM}} --agent antigravity -y"
      - cmd: "{{.SKILLS_CLI}} update -y || echo 'Update skipped'"
      - for: { var: SKILLS }
        cmd: "mv .agents/skills/{{.ITEM}} .agents/skills/community/ 2>/dev/null || true"
      - cmd: "rm -r .claude .kiro 2>/dev/null || true"

  uninstall-skills:
    desc: "Désinstalle tous les skills IA du projet et nettoie le dossier community."
    cmds:
      - for: { var: SKILLS }
        cmd: "{{.SKILLS_CLI}} remove {{.ITEM}} -y || echo '{{.ITEM}} already removed'"
      - cmd: "rm -r .agents/skills/community 2>/dev/null || true"
      - cmd: "rm -r .claude .kiro 2>/dev/null || true"

  default:
    desc: "Liste toutes les commandes du projet."
    cmds:
      - task --list
